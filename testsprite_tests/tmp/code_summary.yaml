version: "2"
type: frontend
tech_stack:
  - Java 17
  - Spring Boot 3.2.5
  - Thymeleaf
  - HTML/CSS/JavaScript
  - In-memory repositories
routes:
  - path: /
    file: src/main/resources/templates/index.html
    auth_required: false
    description: Public landing page
  - path: /login
    file: src/main/resources/templates/auth/login.html
    auth_required: false
    description: Multi-role login page (citizen, officer, admin tabs)
  - path: /register
    file: src/main/resources/templates/auth/register.html
    auth_required: false
    description: Citizen registration form
  - path: /otp
    file: src/main/resources/templates/auth/otp.html
    auth_required: false
    description: OTP verification after registration
  - path: /citizen/dashboard
    file: src/main/resources/templates/citizen/dashboard.html
    auth_required: true
    description: Citizen dashboard
  - path: /citizen/complaints
    file: src/main/resources/templates/citizen/complaints.html
    auth_required: true
    description: List citizen complaints
  - path: /citizen/complaints/new
    file: src/main/resources/templates/citizen/complaint-form.html
    auth_required: true
    description: Submit new complaint
  - path: /citizen/discussions
    file: src/main/resources/templates/citizen/discussions.html
    auth_required: true
    description: Community discussions
  - path: /citizen/polls
    file: src/main/resources/templates/citizen/polls.html
    auth_required: true
    description: Public polls voting
  - path: /citizen/suggestions
    file: src/main/resources/templates/citizen/suggestions.html
    auth_required: true
    description: Citizen suggestions list
  - path: /citizen/profile
    file: src/main/resources/templates/citizen/profile.html
    auth_required: true
    description: Citizen profile management
  - path: /citizen/notifications
    file: src/main/resources/templates/citizen/notifications.html
    auth_required: true
    description: User notifications
  - path: /citizen/leaderboard
    file: src/main/resources/templates/citizen/leaderboard.html
    auth_required: true
    description: Points leaderboard
  - path: /officer/dashboard
    file: src/main/resources/templates/officer/dashboard.html
    auth_required: true
    description: Officer dashboard
  - path: /officer/complaints
    file: src/main/resources/templates/officer/complaint-queue.html
    auth_required: true
    description: Officer complaint queue
  - path: /admin/dashboard
    file: src/main/resources/templates/admin/dashboard.html
    auth_required: true
    description: Admin dashboard
  - path: /admin/users
    file: src/main/resources/templates/admin/users.html
    auth_required: true
    description: User management
  - path: /admin/analytics
    file: src/main/resources/templates/admin/analytics.html
    auth_required: true
    description: Platform analytics
features:
  - name: Citizen Login
    description: Login with phone number and password
    files:
      - src/main/java/com/opengovtbd/controller/AuthController.java
      - src/main/resources/templates/auth/login.html
    entry_route: /login
    user_interactions:
      - Select citizen tab on login page
      - Fill phone input field
      - Fill password input field
      - Click Login button to submit
      - See error message on invalid credentials
    api_calls:
      - method: POST
        endpoint: /login/citizen
    auth_required: false
  - name: Officer Login
    description: Login with officer ID, government email and password
    files:
      - src/main/java/com/opengovtbd/controller/AuthController.java
      - src/main/resources/templates/auth/login.html
    entry_route: /login
    user_interactions:
      - Select officer tab on login page
      - Fill officer ID field
      - Fill government email field
      - Fill password field
      - Click Login button
    api_calls:
      - method: POST
        endpoint: /login/officer
    auth_required: false
  - name: Admin Login
    description: Login with admin email and password
    files:
      - src/main/java/com/opengovtbd/controller/AuthController.java
      - src/main/resources/templates/auth/login.html
    entry_route: /login
    user_interactions:
      - Select admin tab on login page
      - Fill email field
      - Fill password field
      - Click Login button
    api_calls:
      - method: POST
        endpoint: /login/admin
    auth_required: false
  - name: Citizen Registration
    description: Register new citizen account with OTP verification
    files:
      - src/main/java/com/opengovtbd/controller/AuthController.java
      - src/main/resources/templates/auth/register.html
      - src/main/resources/templates/auth/otp.html
    entry_route: /register
    user_interactions:
      - Fill full name, phone, NID, date of birth, password
      - Submit registration form
      - Enter OTP on verification page
      - Redirect to citizen dashboard on success
    api_calls:
      - method: POST
        endpoint: /register
      - method: POST
        endpoint: /otp/verify
    auth_required: false
  - name: Submit Complaint
    description: Citizen submits a new government complaint
    files:
      - src/main/java/com/opengovtbd/controller/ComplaintController.java
      - src/main/resources/templates/citizen/complaint-form.html
    entry_route: /citizen/complaints/new
    user_interactions:
      - Navigate to new complaint form
      - Fill title, category, description, location
      - Submit complaint
      - View complaint in list
    api_calls:
      - method: POST
        endpoint: /citizen/complaints/new
    auth_required: true
  - name: Officer Complaint Management
    description: Officer views and updates complaint status
    files:
      - src/main/java/com/opengovtbd/controller/ComplaintController.java
      - src/main/resources/templates/officer/complaint-queue.html
    entry_route: /officer/complaints
    user_interactions:
      - View complaint queue
      - Open complaint details
      - Update status and reply
    api_calls:
      - method: POST
        endpoint: /officer/complaints/{id}/status
      - method: POST
        endpoint: /officer/complaints/{id}/reply
    auth_required: true
  - name: Poll Voting
    description: Citizen votes on public polls
    files:
      - src/main/java/com/opengovtbd/controller/PollController.java
      - src/main/resources/templates/citizen/polls.html
    entry_route: /citizen/polls
    user_interactions:
      - View active polls
      - Select option and vote
    api_calls:
      - method: POST
        endpoint: /citizen/polls/{id}/vote
    auth_required: true
  - name: Discussion Forum
    description: Citizens create and interact with discussions
    files:
      - src/main/java/com/opengovtbd/controller/DiscussionController.java
      - src/main/resources/templates/citizen/discussions.html
    entry_route: /citizen/discussions
    user_interactions:
      - View discussions list
      - Create new discussion
      - Like, comment, bookmark discussions
    api_calls:
      - method: POST
        endpoint: /citizen/discussions/new
      - method: POST
        endpoint: /citizen/discussions/{id}/comment
    auth_required: true
  - name: Admin User Management
    description: Admin views and toggles user active status
    files:
      - src/main/java/com/opengovtbd/controller/AdminController.java
      - src/main/resources/templates/admin/users.html
    entry_route: /admin/users
    user_interactions:
      - View all users
      - Toggle user active/inactive status
    api_calls:
      - method: POST
        endpoint: /admin/users/{id}/toggle-active
    auth_required: true
known_limitations:
  - issue: In-memory data storage - all data resets on server restart
    location: src/main/java/com/opengovtbd/repository/
    impact: No persistence between sessions
  - issue: Demo OTP is hardcoded and displayed on OTP page
    location: src/main/java/com/opengovtbd/service/AuthService.java
    impact: Not suitable for production security

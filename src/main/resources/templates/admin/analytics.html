<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head th:replace="~{fragments/layout :: head('Analytics')}"></head>
  <body>
    <div class="app-shell">
      <nav th:replace="~{fragments/layout :: sidebar-admin('analytics')}"></nav>
      <div class="sidebar-overlay"></div>
      <div class="main">
        <div
          th:replace="~{fragments/layout :: topbar('Analytics Dashboard', ${admin.fullName}, ${unreadCount}, '/admin/dashboard')}"
        ></div>
        <div class="content">
          <div class="analytics-dark">
            <div class="grid grid-4 fade-up" style="margin-bottom: 22px">
              <div class="panel">
                <div class="label">Discussions</div>
                <div class="metric" th:text="${analytics.totalDiscussions()}">
                  0
                </div>
              </div>
              <div class="panel">
                <div class="label">Polls Created</div>
                <div class="metric" th:text="${analytics.totalPolls()}">0</div>
              </div>
              <div class="panel">
                <div class="label">Suggestions</div>
                <div class="metric" th:text="${analytics.totalSuggestions()}">
                  0
                </div>
              </div>
              <div class="panel">
                <div class="label">Complaints Resolved</div>
                <div class="metric" th:text="${analytics.resolvedComplaints()}">
                  0
                </div>
              </div>
            </div>

            <div class="grid grid-2">
              <div class="panel fade-up d1">
                <h3 style="margin: 0 0 16px; color: #fff">
                  Complaints by Category
                </h3>
                <canvas id="categoryChart" height="220"></canvas>
              </div>
              <div class="panel fade-up d2">
                <h3 style="margin: 0 0 16px; color: #fff">
                  Complaints by Division
                </h3>
                <canvas id="divisionChart" height="220"></canvas>
              </div>
            </div>

            <div class="panel fade-up d3" style="margin-top: 22px">
              <h3 style="margin: 0 0 16px; color: #fff">Resolution Rate</h3>
              <div style="display: flex; align-items: center; gap: 20px">
                <div
                  class="progress-bar"
                  style="flex: 1; height: 14px; background: #27272a"
                >
                  <div
                    th:attr="data-bar-pct=${analytics.resolutionRate()}"
                    style="width: 0; background: #818cf8"
                  ></div>
                </div>
                <div
                  class="metric mono"
                  style="font-size: 18px"
                  th:text="${#numbers.formatDecimal(analytics.resolutionRate(),1,1)} + '%'"
                >
                  0%
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <script th:inline="javascript">
      const categoryData = /*[[${analytics.complaintsByCategory()}]]*/ {};
      const divisionData = /*[[${analytics.complaintsByDivision()}]]*/ {};

      function paint(id, data, color) {
        const ctx = document.getElementById(id);
        if (!ctx) return;
        new Chart(ctx, {
          type: "bar",
          data: {
            labels: Object.keys(data),
            datasets: [
              {
                data: Object.values(data),
                backgroundColor: color,
                borderRadius: 8,
                maxBarThickness: 42,
              },
            ],
          },
          options: {
            plugins: { legend: { display: false } },
            scales: {
              y: {
                beginAtZero: true,
                ticks: { precision: 0, color: "#A1A1AA" },
                grid: { color: "#27272A" },
              },
              x: { ticks: { color: "#A1A1AA" }, grid: { color: "#27272A" } },
            },
          },
        });
      }
      paint("categoryChart", categoryData, "#818CF8");
      paint("divisionChart", divisionData, "#F472B6");
    </script>
    <script th:src="@{/js/main.js}"></script>
  </body>
</html>

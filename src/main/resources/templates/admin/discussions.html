<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Discussions')}"></head>
<body>
<div class="app-shell">
  <nav th:replace="~{fragments/layout :: sidebar-admin('discussions')}"></nav>
  <div class="sidebar-overlay"></div>
  <div class="main">
    <div th:replace="~{fragments/layout :: topbar('Discussions Oversight', ${admin.fullName}, ${unreadCount}, '/admin/dashboard')}"></div>
    <div class="content">

      <div class="grid grid-2" style="margin-bottom:22px;">
        <div class="card stat-card"><div class="stat-icon" style="background:var(--setu-blue-light);color:var(--setu-blue);"><span class="material-symbols-rounded">forum</span></div><div><div class="stat-value" th:text="${#lists.size(discussions)}">0</div><div class="stat-label">Published Discussions</div></div></div>
        <div class="card stat-card"><div class="stat-icon" style="background:var(--warning-bg);color:#92600B;"><span class="material-symbols-rounded">hourglass_top</span></div><div><div class="stat-value" th:text="${#lists.size(pending)}">0</div><div class="stat-label">Awaiting Officer Approval</div></div></div>
      </div>

      <div class="card">
        <table class="data-table">
          <thead><tr><th>Title</th><th>Category</th><th>Likes</th><th>Comments</th><th>Status</th></tr></thead>
          <tbody>
          <tr th:each="d : ${discussions}">
            <td th:text="${d.title}">Title</td>
            <td><span class="pill pill-muted" th:text="${d.category}">Cat</span></td>
            <td th:text="${d.likeCount}">0</td>
            <td th:text="${d.commentCount}">0</td>
            <td>
              <span th:if="${d.pinned}" class="pill pill-warning" style="margin-right:4px;">Pinned</span>
              <span th:if="${d.locked}" class="pill pill-error">Locked</span>
              <span th:if="${!d.pinned and !d.locked}" class="pill pill-success">Live</span>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(discussions)}"><td colspan="5" class="text-muted" style="text-align:center;padding:24px;">No discussions published yet.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>

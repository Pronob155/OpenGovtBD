<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Page Not Found')}"></head>
<body>
<div class="error-page">
  <div class="pop-in">
    <div class="error-code">404</div>
    <h2 style="margin:10px 0 8px;">This page has wandered off the map.</h2>
    <p class="text-muted" style="margin:0 0 24px;">The page you're looking for doesn't exist or may have been moved.</p>
    <a href="/" class="btn btn-primary">Back to Home</a>
  </div>
</div>
</body>
</html>

<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head th:replace="~{fragments/layout :: head('Register')}"></head>
  <body class="neuform-page">
    <div class="auth-shell">
      <a href="/" class="auth-topbrand"
        ><div class="brand-mark">
          <span class="material-symbols-rounded" style="color: #fff"
            >account_balance</span
          >
        </div>
        OpenGovtBD</a
      >
      <button
        type="button"
        class="icon-btn theme-fab"
        data-client-theme-toggle
        aria-label="Toggle dark mode"
        style="position: absolute; top: 20px; right: 20px"
      >
        <span class="material-symbols-rounded theme-icon">dark_mode</span>
      </button>
      <div class="auth-form-side">
        <div class="auth-card neuform-card pop-in" style="padding: 20px">
          <h2
            class="auth-display-title"
            style="margin: 0 0 4px; font-size: 22px"
          >
            Create your citizen account
          </h2>
          <p class="text-muted" style="margin: 0 0 16px; font-size: 12.5px">
            Step 1 of 2 — basic details. Takes less than two minutes.
          </p>

          <div
            th:if="${error}"
            class="alert alert-error"
            style="margin-bottom: 18px"
          >
            <span class="material-symbols-rounded">error</span
            ><span th:text="${error}"></span>
          </div>

          <form method="post" th:action="@{/register}">
            <div class="field">
              <label for="fullName">Full Name</label
              ><input
                class="input neuform-input"
                id="fullName"
                name="fullName"
                placeholder="As per NID"
                required
              />
            </div>
            <div class="field">
              <label for="phone">Mobile Number</label>
              <div class="input-group">
                <span class="prefix">+88</span
                ><input
                  class="input neuform-input"
                  id="phone"
                  name="phone"
                  placeholder="01XXXXXXXXX"
                  pattern="01[0-9]{9}"
                  required
                />
              </div>
            </div>
            <div class="field">
              <label for="nid">National ID Number</label
              ><input
                class="input neuform-input"
                id="nid"
                name="nid"
                placeholder="10 or 17 digit NID"
                required
              />
            </div>
            <div class="field">
              <label for="dob">Date of Birth</label
              ><input
                class="input neuform-input"
                type="date"
                id="dob"
                name="dob"
                required
              />
            </div>
            <div class="field">
              <label for="password">Create Password</label
              ><input
                class="input neuform-input"
                type="password"
                id="password"
                name="password"
                minlength="6"
                required
              />
            </div>
            <div class="field checkbox-row">
              <input type="checkbox" required /> I agree to the Terms of Service
              and Privacy Policy
            </div>
            <button class="btn btn-primary btn-block" type="submit">
              Continue to OTP Verification
              <span class="material-symbols-rounded">arrow_forward</span>
            </button>
            <p style="text-align: center; margin-top: 14px; font-size: 13.5px">
              Already have an account?
              <a href="/login" style="color: var(--setu-blue); font-weight: 600"
                >Log in</a
              >
            </p>
          </form>
        </div>
      </div>
    </div>
    <script th:src="@{/js/main.js}"></script>
  </body>
</html>

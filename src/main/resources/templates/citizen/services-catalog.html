<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="en">

<head th:replace="~{fragments/layout :: head('Services Catalog')}"></head>

<body th:classappend="${citizen != null and citizen.darkMode} ? 'dark'" th:attr="data-role=${currentRole}">
  <a th:replace="~{fragments/layout :: skip-link}"></a>
  <div class="app-shell">
    <nav th:replace="~{fragments/layout :: sidebar-citizen('services')}"></nav>
    <div class="sidebar-overlay"></div>
    <div class="main">
      <div
        th:replace="~{fragments/layout :: topbar('Services Catalog', ${citizen.fullName}, ${unreadCount}, '/citizen/notifications')}">
      </div>
      <main class="content" id="main-content">
        <div
          style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:18px;">
          <div>
            <h2 style="margin:0 0 4px;">Officer-curated Digital Services</h2>
            <p class="text-muted" style="margin:0;">Services added dynamically by government officers, organized by
              category.</p>
          </div>
          <a href="/citizen/services" class="text-muted" style="font-size:13px;">&larr; Back to official portals</a>
        </div>

        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px;">
          <a th:href="@{/citizen/services/catalog(category='all')}" class="filter-chip"
            th:classappend="${selectedCategory == 'all'} ? 'active'">All</a>
          <a th:each="cat : ${categories}" th:href="@{/citizen/services/catalog(category=${cat})}" class="filter-chip"
            th:classappend="${selectedCategory == cat} ? 'active'" th:text="${cat}">Category</a>
        </div>

        <div th:if="${#lists.isEmpty(services)}" class="card empty-state">
          <div class="ico"><span class="material-symbols-rounded">apps</span></div>
          <h3>No services yet</h3>
          <p>Officers haven't published any services in this category yet. Check back soon.</p>
        </div>

        <div class="grid grid-4">
          <a th:each="s : ${services}" th:href="${s.externalUrl}" target="_blank" rel="noopener"
            class="service-card card hoverable fade-up">
            <div class="ico"><span class="material-symbols-rounded" th:text="${s.logoIcon}">apps</span></div>
            <div class="name" th:text="${s.name}">Service</div>
            <div class="desc" th:text="${s.description}">Description</div>
            <span class="pill pill-muted" style="align-self:flex-start;" th:text="${s.category}">Category</span>
          </a>
        </div>
      </main>
    </div>
  </div>
  <script th:src="@{/js/main.js}"></script>
</body>

</html>

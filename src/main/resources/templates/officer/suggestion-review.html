<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="en">
<head th:replace="~{fragments/layout :: head('Suggestion Review')}"></head>
<body th:attr="data-role=${currentRole}">
  <a th:replace="~{fragments/layout :: skip-link}"></a>
<div class="app-shell">
  <nav th:replace="~{fragments/layout :: sidebar-officer('suggestions')}"></nav>
  <div class="sidebar-overlay"></div>
  <div class="main">
    <div th:replace="~{fragments/layout :: topbar('Suggestion Review', ${officer.fullName}, ${unreadCount}, '/officer/dashboard')}"></div>
    <main class="content" id="main-content">
      <div class="grid grid-2">
        <div class="card card-pad fade-up" th:each="s : ${suggestions}">
          <div style="display:flex;justify-content:space-between;">
            <span class="pill" th:classappend="'pill-' + ${s.status.tone}" th:text="${s.status.label}">Status</span>
            <span class="text-muted" style="font-size:12px;" th:text="${s.score} + ' net votes'">score</span>
          </div>
          <h4 style="margin:10px 0 6px;" th:text="${s.title}">Title</h4>
          <p class="text-muted" style="font-size:13.5px;margin:0 0 6px;" th:text="${s.description}">desc</p>
          <div class="text-muted" style="font-size:12px;margin-bottom:14px;" th:text="'by ' + ${userRepository.findFullName(s.authorId)}">author</div>

          <form th:action="@{'/officer/suggestions/' + ${s.id} + '/status'}" method="post">
            <div class="field">
              <select class="input" name="status" required>
                <option value="SUBMITTED" th:selected="${s.status.name() == 'SUBMITTED'}">Submitted</option>
                <option value="UNDER_REVIEW" th:selected="${s.status.name() == 'UNDER_REVIEW'}">Under Review</option>
                <option value="ACCEPTED" th:selected="${s.status.name() == 'ACCEPTED'}">Accepted</option>
                <option value="IMPLEMENTED" th:selected="${s.status.name() == 'IMPLEMENTED'}">Implemented</option>
                <option value="REJECTED" th:selected="${s.status.name() == 'REJECTED'}">Rejected</option>
              </select>
            </div>
            <div class="field"><textarea class="input" name="feedback" rows="2" placeholder="Feedback to citizen" th:text="${s.governmentFeedback}" required></textarea></div>
            <button class="btn btn-primary btn-block btn-sm" type="submit">Update</button>
          </form>
        </div>
      </div>
    </main>
  </div>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>

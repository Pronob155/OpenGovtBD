<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="en">

<head th:replace="~{fragments/layout :: head('Create Poll')}"></head>

<body th:attr="data-role=${currentRole}">
  <a th:replace="~{fragments/layout :: skip-link}"></a>
  <div class="app-shell">
    <nav th:replace="~{fragments/layout :: sidebar-officer('polls')}"></nav>
    <div class="sidebar-overlay"></div>
    <div class="main">
      <div
        th:replace="~{fragments/layout :: topbar('Create Official Poll', ${officer.fullName}, ${unreadCount}, '/officer/dashboard')}">
      </div>
      <main class="content content-xs" id="main-content">
        <div class="card card-pad">
          <form th:action="@{/officer/polls/new}" method="post">
            <div class="field"><label>Poll Question</label><input class="input" name="question"
                placeholder="e.g. Which service should we digitize next?" required /></div>
            <div class="field">
              <label>Category</label>
              <select class="input" name="category" required>
                <option>Digital Services</option>
                <option>Governance</option>
                <option>Infrastructure</option>
                <option>Health</option>
                <option>Education</option>
                <option>Environment</option>
              </select>
            </div>
            <div class="field">
              <label>Options (one per line, at least 2)</label>
              <textarea class="input" name="options" rows="5" placeholder="Option A&#10;Option B&#10;Option C"
                required></textarea>
            </div>
            <div class="field"><label>Open for how many days?</label><input class="input" type="number" name="daysOpen"
                value="7" min="1" max="60" /></div>
            <button class="btn btn-primary btn-block" type="submit">Publish Poll</button>
          </form>
        </div>
      </main>
    </div>
  </div>
  <script th:src="@{/js/main.js}"></script>
</body>

</html>
